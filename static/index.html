<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Athena Zero</title>

  <!-- tab icon: a small gold owl -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%230E1420'/%3E%3Cpath fill='%23C9A15B' d='M9.5 2.2 L15.8 7.6 Q20 6.6 24.2 7.6 L30.5 2.2 Q32.2 8 31.7 13 Q34.2 17 34.2 23 Q34.2 30 30.6 35 L29.6 37.8 L27.2 36.2 L25 38.2 L23 36.5 Q21.5 36.9 20 36.9 Q18.5 36.9 17 36.5 L15 38.2 L12.8 36.2 L10.4 37.8 L9.4 35 Q5.8 30 5.8 23 Q5.8 17 8.3 13 Q7.8 8 9.5 2.2Z'/%3E%3Ccircle cx='14.4' cy='16.2' r='4.6' fill='%230E1420'/%3E%3Ccircle cx='25.6' cy='16.2' r='4.6' fill='%230E1420'/%3E%3Ccircle cx='14.4' cy='16.2' r='2.1' fill='%23C9A15B'/%3E%3Ccircle cx='25.6' cy='16.2' r='2.1' fill='%23C9A15B'/%3E%3C/svg%3E">

  <!-- fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/style.css?v=6">

  <!-- marked turns markdown into HTML, DOMPurify makes that HTML safe -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
</head>
<body>

  <!-- The owl logo. It is drawn ONCE here and reused everywhere with <use href="#owl">.
       It uses "currentColor", so it takes the colour of whatever it is placed in
       (gold in dark mode, blue in light mode). -->
  <svg width="0" height="0" style="position:absolute">
    <symbol id="owl" viewBox="0 0 40 40">
      <mask id="owl-holes" maskUnits="userSpaceOnUse" x="0" y="0" width="40" height="40">
        <rect width="40" height="40" fill="white"/>
        <!-- everything in black below is cut out of the owl -->
        <circle cx="14.4" cy="16.2" r="4.6" fill="black"/>
        <circle cx="25.6" cy="16.2" r="4.6" fill="black"/>
        <path d="M20 19.6 L18.7 22.2 L20 24.6 L21.3 22.2Z" fill="black"/>
        <path d="M10.2 24.5 Q9.6 30.5 13.2 34.2 M29.8 24.5 Q30.4 30.5 26.8 34.2" fill="none" stroke="black" stroke-width="1.15" stroke-linecap="round"/>
        <path d="M16.6 28 Q20 31 23.4 28 M17.4 31.4 Q20 33.8 22.6 31.4" fill="none" stroke="black" stroke-width="1.1" stroke-linecap="round"/>
      </mask>
      <g mask="url(#owl-holes)">
        <path fill="currentColor" d="M9.5 2.2 L15.8 7.6 Q20 6.6 24.2 7.6 L30.5 2.2 Q32.2 8 31.7 13 Q34.2 17 34.2 23 Q34.2 30 30.6 35 L29.6 37.8 L27.2 36.2 L25 38.2 L23 36.5 Q21.5 36.9 20 36.9 Q18.5 36.9 17 36.5 L15 38.2 L12.8 36.2 L10.4 37.8 L9.4 35 Q5.8 30 5.8 23 Q5.8 17 8.3 13 Q7.8 8 9.5 2.2Z"/>
      </g>
      <!-- pupils -->
      <circle cx="14.4" cy="16.2" r="2.1" fill="currentColor"/>
      <circle cx="25.6" cy="16.2" r="2.1" fill="currentColor"/>
    </symbol>
  </svg>

  <!-- Loading screen (shows for about 3 seconds) -->
  <div id="boot">
    <svg class="boot-owl"><use href="#owl"/></svg>
    <div class="boot-name">Athena Zero</div>
    <div class="boot-text" id="bootText">Booting up...</div>
  </div>

  <div class="app">

    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar" id="sidebar">

      <div class="brand">
        <svg class="logo"><use href="#owl"/></svg>
        <span>Athena Zero</span>
        <button class="tool-btn close-btn" id="closeBtn" type="button" aria-label="Close sidebar">&#10094;</button>
      </div>
      <div class="line"></div>

      <div class="sidebar-body">
        <button class="new-chat" id="newChatBtn" type="button">+ New chat</button>

        <div class="search-wrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input id="searchBox" type="search" placeholder="Search chats">
        </div>

        <p class="list-label">Recent chats</p>
        <nav class="chat-list" id="chatList"></nav>

        <div class="sidebar-foot">
          <button class="tool-btn" id="themeBtn" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
            <span>Light / dark</span>
          </button>
          <button class="tool-btn" id="settingsBtn" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
            <span>Settings</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- ================= MAIN AREA ================= -->
    <main class="main">

      <header class="topbar">
        <button class="tool-btn menu-btn" id="menuBtn" type="button">&#9776;</button>
        <h1 id="chatTitle" title="Double-click to rename">New chat</h1>
        <button class="tool-btn" id="exportBtn" type="button">Export</button>
      </header>
      <div class="line top-line"></div>

      <!-- all the messages -->
      <div class="messages" id="messages">
        <div class="messages-inner">

          <!-- welcome screen, hidden once the chat starts -->
          <section class="welcome" id="welcome">
            <svg class="welcome-owl"><use href="#owl"/></svg>
            <h2>Welcome.</h2>
            <p>Ask me anything.</p>
          </section>

          <div class="thread" id="thread"></div>
        </div>
      </div>

      <!-- text box at the bottom -->
      <div class="composer">
        <div class="input-box">
          <textarea id="input" rows="1" placeholder="Message Athena Zero"></textarea>
          <button class="send-btn" id="sendBtn" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
        <p class="hint">Enter to send &middot; Shift+Enter for a new line</p>
        <p class="hint credit">Powered by Groq &middot; Model: OpenAI gpt-oss-20b</p>
      </div>
    </main>
  </div>

  <!-- dark background behind the sidebar on phones -->
  <div class="scrim" id="scrim" hidden></div>

  <!-- ================= SETTINGS POPUP ================= -->
  <dialog id="settingsBox">
    <form method="dialog" class="settings">
      <h3>Settings</h3>

      <div class="field">
        <label>Appearance</label>
        <div class="choice" data-key="theme">
          <button type="button" data-value="dark">Dark</button>
          <button type="button" data-value="light">Light</button>
          <button type="button" data-value="system">System</button>
        </div>
      </div>

      <div class="field">
        <label>Text size</label>
        <div class="choice" data-key="size">
          <button type="button" data-value="s">Small</button>
          <button type="button" data-value="m">Medium</button>
          <button type="button" data-value="l">Large</button>
        </div>
      </div>

      <div class="field">
        <label>Reply style</label>
        <div class="choice" data-key="style">
          <button type="button" data-value="brief">Brief</button>
          <button type="button" data-value="balanced">Balanced</button>
          <button type="button" data-value="detailed">Detailed</button>
        </div>
      </div>

      <div class="field">
        <label for="tempSlider">Creativity <output id="tempValue"></output></label>
        <input type="range" id="tempSlider" min="0" max="1.2" step="0.1">
      </div>

      <div class="field">
        <label for="instrBox">Custom instructions</label>
        <textarea id="instrBox" rows="3" maxlength="800" placeholder="e.g. Call me Jiya. Explain things with examples."></textarea>
      </div>

      <div class="field buttons">
        <button type="button" class="danger-btn" id="deleteAllBtn">Delete all chats</button>
        <button class="done-btn">Done</button>
      </div>
    </form>
  </dialog>

  <script src="/script.js?v=6"></script>
</body>
</html>
